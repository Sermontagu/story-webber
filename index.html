<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Story Webber</title>
<meta name="description" content="A free planner for novel writers: map your characters, places and secrets, track scenes and chapters, and chart character arcs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen planning board. Header (lenses, filters, search), map canvas beside an editable dossier panel, beat strip along the bottom. Phones get a bottom sheet. Deliberately a single dark theme: canon muted, drafts in neon. */
:root{
  color-scheme:dark;
  --bg:#0a0c0f; --surface:#11141a; --surface-2:#181c24; --surface-3:#202632; --line:#262d39; --line-2:#343d4c;
  --fg:#d8dce3; --muted:#7f8899; --faint:#6b7586; --dot:rgba(216,220,227,.07);
  --person:#c7a25e; --corp:#5e9dac; --place:#8c86c6; --event:#bf6f8e; --idea:#78a685;
  --open:#ff4438; --herring:#c7a25e; --irony:#ffd23d; --withheld:#5ad1ff;
  --accent:#ff2bd6; --ok:#7ee08a;
  --f-display:"Oxanium","Eurostile","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-inline:16px;padding-block:12px;box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
h1{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.08em;text-transform:uppercase;margin:0}
h1 small{font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.04em;color:var(--muted);text-transform:none;margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;border-left:1px solid var(--line-2);padding:4px 10px;font:500 12px var(--f-body);cursor:pointer;color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.4}
.search{margin-left:auto;font:13px var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;width:170px;max-width:100%}

/* main */
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px;min-height:0}
.board{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:0;
  background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);background-size:24px 24px}
#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#graph:active{cursor:grabbing}
.tools{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.tools>*{pointer-events:auto}
.btn{font:500 12px var(--f-body);background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--fg)}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn:disabled{opacity:.4;cursor:default}
.btn.neon{border-color:var(--sc,var(--accent));color:var(--sc,var(--accent));box-shadow:0 0 10px -2px var(--sc,var(--accent))}
.btn.danger{color:var(--open);border-color:color-mix(in srgb,var(--open) 55%,var(--line))}
.btn.ghost{background:transparent}
.drafting{font:500 12px var(--f-mono);color:var(--sc);border:1px solid var(--sc);border-radius:6px;padding:3px 8px;background:color-mix(in srgb,var(--sc) 10%,var(--surface));box-shadow:0 0 12px -3px var(--sc)}
.hint{position:absolute;left:10px;bottom:8px;font:12px var(--f-mono);color:var(--faint);pointer-events:none;max-width:calc(100% - 20px)}
.boardmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font:13px var(--f-mono);padding:24px;pointer-events:none}
.boardmsg[hidden]{display:none}

/* map marks */
.lk .vis{stroke:var(--line-2);stroke-width:1.3;fill:none}
.lk .hit{stroke:transparent;stroke-width:12;cursor:pointer}
.lk.herring .vis{stroke:var(--herring);stroke-dasharray:1.5 4;stroke-width:2;stroke-linecap:round}
.lk.draft .vis{stroke:var(--sc);stroke-dasharray:6 4;stroke-width:1.8;filter:drop-shadow(0 0 3px var(--sc))}
.lk.cut .vis{stroke:var(--open);stroke-dasharray:2 6;opacity:.7}
.lk.hl .vis{stroke:var(--fg);stroke-width:2.2}
.lk.hl.draft .vis{stroke:var(--sc)}
.lk.irony .vis{stroke:var(--irony);stroke-width:2.4;filter:drop-shadow(0 0 3px var(--irony))}
.lk.withheld .vis{stroke:var(--withheld);stroke-width:2.4;filter:drop-shadow(0 0 3px var(--withheld))}
.lab{font:10.5px var(--f-mono);fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.tip{position:absolute;z-index:5;pointer-events:none;max-width:280px;background:var(--surface-3);border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;font:12.5px/1.45 var(--f-body);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.tip[hidden]{display:none}
.tip b{font-weight:600}
.tip .m{display:block;font:11px var(--f-mono);color:var(--muted);margin-top:2px}
.temp{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3;pointer-events:none}
.node{cursor:pointer}
.node .core{stroke:var(--bg);stroke-width:2}
.node.draft .core{fill:var(--bg)!important;stroke:var(--sc);stroke-width:2.5;filter:drop-shadow(0 0 5px var(--sc))}
.node .nm{font:500 11.5px var(--f-body);fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.node.person .nm{font-weight:600;font-size:12.5px}
.node.draft .nm{fill:var(--sc)}
.node .ring{fill:none;stroke:var(--fg);stroke-width:1.5;opacity:0}
.node.sel .ring{opacity:1}
.node.multi .ring{opacity:1;stroke:var(--accent);stroke-dasharray:3 3}
.node.target .ring{opacity:1;stroke:var(--accent);stroke-width:3}
.node .dot{fill:var(--open);stroke:var(--bg);stroke-width:1.5}
.node .pinmark{fill:var(--fg);stroke:var(--bg);stroke-width:1}
.node .handle{fill:var(--surface-3);stroke:var(--accent);stroke-width:1.5;opacity:0;cursor:crosshair;transition:opacity .15s}
.node:hover .handle,.node.sel .handle{opacity:1}
.node.quiet{opacity:.45}
.node.quiet .nm{font-size:10px;fill:var(--muted)}
.dim{opacity:.12!important}
.faded{opacity:.06!important}
.hide{display:none}

/* panel */
aside{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.sheetbar{display:none}
.tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 8px 7px;font:500 13px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .n{font:500 10.5px var(--f-mono);margin-left:4px;color:var(--faint)}
.tabs .n.red{color:var(--open)}
.pbody{overflow:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:14px;min-height:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.eyebrow .sw{width:9px;height:9px;border-radius:50%;background:var(--c)}
h2{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:.02em;margin:0;line-height:1.15;text-wrap:balance}
h3{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:8px}
h3 .sp{flex:1}
p{margin:0;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.back{all:unset;cursor:pointer;font:500 12px var(--f-mono);color:var(--muted)}
.back:hover{color:var(--fg)}
/* editable fields: look like text until focused */
.ed{width:100%;box-sizing:border-box;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--fg);font:inherit;padding:3px 6px;margin:-4px -7px;resize:none;overflow:hidden;line-height:1.5}
.ed:hover:not(:disabled){border-color:var(--line)}
.ed:focus{background:var(--surface-2);border-color:var(--line-2);outline:none}
.ed:disabled{opacity:1}
.ed.title{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.2}
.ed.mini{width:auto;margin:0;padding:1px 4px;font:500 11px var(--f-mono);border-color:var(--line)}
input.ed.num{width:3.4em;text-align:center;font:500 12px var(--f-mono);margin:0;padding:1px 2px;border-color:var(--line)}
select.ed{width:auto;margin:0;padding:1px 4px;font:500 11px var(--f-mono);border-color:var(--line);background:var(--surface)}
.ph::placeholder,.ed::placeholder{color:var(--faint)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.row .k{font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0;padding-top:4px}
.row .v{margin:0}
.row.step{grid-template-columns:auto minmax(0,1fr) auto}
.x{all:unset;cursor:pointer;color:var(--faint);font:14px var(--f-mono);padding:2px 4px;line-height:1}
.x:hover{color:var(--open)}
.add{all:unset;cursor:pointer;font:500 12px var(--f-mono);color:var(--muted);padding:2px 0}
.add:hover{color:var(--accent)}
.box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.box.red{background:color-mix(in srgb,var(--open) 7%,var(--surface));border-color:color-mix(in srgb,var(--open) 40%,var(--line))}
.box.red>h3{color:var(--open)}
.box.neonbox{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 6%,var(--surface));box-shadow:0 0 14px -6px var(--sc)}
.box.note{background:color-mix(in srgb,var(--herring) 8%,var(--surface));border-color:color-mix(in srgb,var(--herring) 35%,var(--line))}
.q{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--open) 25%,var(--line))}
.q:first-of-type{border-top:0;padding-top:0}
.q .qh{display:flex;gap:8px;align-items:flex-start}
.q .qh>span{flex:1}
.q .qh b{display:block;font:500 11px var(--f-mono);text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.q textarea{min-height:3.5em}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{all:unset;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-width:0}
.item .nm:hover{color:var(--accent)}
.item .sw{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.item .rel{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.item .b{font:11px var(--f-mono);color:var(--muted);white-space:nowrap}
.tag{font:11.5px var(--f-mono);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.tag.hr{color:var(--herring);border-color:var(--herring)}
.tag.red{color:var(--open);border-color:var(--open)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.tag.neon{color:var(--sc);border-color:var(--sc)}
.beatlinks{display:flex;flex-wrap:wrap;gap:6px}
.beatlinks button{font:500 11.5px var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;cursor:pointer}
.beatlinks button:hover{border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:4px;font:500 12px var(--f-body);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 8px}
.pill .sw{width:7px;height:7px;border-radius:50%;background:var(--c)}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
dl.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px}
dl.kv dt{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
dl.kv dd{margin:0}
.legend{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px 10px;align-items:center;font-size:12.5px}
.legend svg{display:block}
.sc{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-left:3px solid var(--sc);border-radius:6px;padding:10px 12px}
.sc.on{box-shadow:0 0 16px -8px var(--sc)}
.sc .meta{font:11px var(--f-mono);color:var(--muted)}
.ch{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.ch:first-child{border-top:0}
.ch .when{font:11px var(--f-mono);color:var(--muted)}
.ch .what{font-size:13px}
.ch.undone .what{text-decoration:line-through;color:var(--muted)}
.confirm{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--open)}
.empty{color:var(--muted);font-size:13px;border:1px dashed var(--line-2);border-radius:6px;padding:12px}

/* beat strip */
footer{min-width:0;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px}
.strip-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.readout{font:600 13px var(--f-body);flex:1;min-width:0}
.readout span{font-weight:400;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font:500 10.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.acts span{border-top:2px solid var(--line-2);padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.beats{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:2px}
.grp{min-width:calc(var(--n,1)*30px);display:flex;flex-direction:column;gap:4px}
.gh{display:flex;align-items:center;gap:3px;border-top:2px solid var(--line-2);padding-top:2px;min-width:0}
.gl{all:unset;box-sizing:border-box;flex:1;min-width:0;font:500 11.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;border-radius:3px;padding:0 3px;cursor:text}
.gl:hover{border-color:var(--line)}
.gl:focus{background:var(--surface-2);border-color:var(--line-2);color:var(--fg)}
span.gl{cursor:default}
.beats .gp,.beats .gx{all:unset;cursor:pointer;flex:none;font:600 12px var(--f-mono);color:var(--muted);padding:0 5px;border-radius:4px;border:1px solid var(--line);line-height:16px}
.beats .gp:hover{color:var(--accent);border-color:var(--accent)}
.beats .gx:hover{color:var(--open);border-color:var(--open)}
.beats .addact{all:unset;cursor:pointer;flex:none;font:500 11px var(--f-mono);color:var(--muted);border:1px dashed var(--line-2);border-radius:4px;padding:3px 8px;margin-top:2px}
.beats .addact:hover{color:var(--accent);border-color:var(--accent)}
.beats button[data-st=idea]{box-shadow:inset 0 -3px 0 #7f8899}
.beats button[data-st=outlined]{box-shadow:inset 0 -3px 0 #5e9dac}
.beats button[data-st=drafted]{box-shadow:inset 0 -3px 0 #c7a25e}
.beats button[data-st=revised]{box-shadow:inset 0 -3px 0 #7ee08a}
.gb [data-beat]{cursor:grab;user-select:none;-webkit-user-select:none}
.gb [data-beat].dragging{opacity:.35}
.dragghost{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--bg);font:600 12px var(--f-mono);padding:4px 8px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.35);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dropbar{position:fixed;z-index:49;width:3px;border-radius:2px;background:var(--accent);pointer-events:none;box-shadow:0 0 8px var(--accent)}
.grp.dropto{outline:2px dashed var(--accent);outline-offset:3px;border-radius:4px}
.prog{display:inline-flex;align-items:center;gap:10px;font:12px var(--f-mono);color:var(--muted)}
.prog .bar{width:90px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:inline-block}
.prog .bar i{display:block;height:100%;background:var(--ok)}
.tpl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tpl[hidden],.prog[hidden]{display:none}
h1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.titlein{all:unset;font:700 19px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);border-bottom:1px dashed transparent;cursor:text;field-sizing:content;min-width:3ch;max-width:70vw;padding-right:.4em}
.subin{all:unset;text-transform:none;font:400 11px var(--f-mono);color:var(--muted);border-bottom:1px dashed transparent;cursor:text;field-sizing:content;min-width:10ch;max-width:50vw}
.subin::placeholder{color:var(--faint)}
.titlein:hover,.subin:hover{border-bottom-color:var(--line-2)}
.titlein:focus,.subin:focus{border-bottom:1px solid var(--accent)}
header{position:relative}
.chip.plus{border-style:dashed;color:var(--muted)}
.chip.plus:hover{color:var(--accent);border-color:var(--accent)}
.lensin{font:500 12px var(--f-body);background:var(--surface-2);color:var(--fg);border:1px solid var(--accent);padding:3px 6px;width:10ch;outline:none}
.pop{position:absolute;top:100%;left:0;z-index:15;margin-top:6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;width:min(330px,calc(100vw - 32px));box-shadow:0 12px 30px rgba(0,0,0,.5)}
.pop[hidden]{display:none}
.timeline{position:absolute;inset:0;overflow:auto;padding:46px 12px 12px}
.timeline[hidden]{display:none}
.tl{display:grid;gap:2px;align-items:center;min-width:max-content}
.tl .th{all:unset;cursor:pointer;font:500 11.5px var(--f-mono);color:var(--muted);text-align:center;padding:2px 0;border-radius:3px}
.tl .th:hover{color:var(--fg)}
.tl .th.cur{color:var(--bg);background:var(--fg)}
.tl .ta{width:0;min-width:100%;box-sizing:border-box;font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:2px solid var(--line-2);padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tn{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;font:500 12px var(--f-body);position:sticky;left:0;background:var(--surface);padding:3px 8px 3px 2px;z-index:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl .tn .sw{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tl .tn:hover,.tl .tn.sel{color:var(--accent)}
.tl .tc{all:unset;cursor:pointer;height:20px;border-radius:4px;background:var(--surface-2);border:1px solid transparent;box-sizing:border-box;min-width:24px}
.tl .tc:hover{border-color:var(--fg)}
.tl .tc.on{background:var(--c);border-color:var(--c)}
.arcs{display:flex;flex-direction:column;gap:12px;min-width:0}
.arcbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.arcchart{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.arcsvg{display:block}
.arcsvg .grid{stroke:var(--line);stroke-width:1}
.arcsvg .zero{stroke:var(--line-2);stroke-width:1.2;stroke-dasharray:4 3}
.arcsvg .div{stroke:var(--line-2);stroke-width:1}
.arcsvg .ax,.arcsvg .act{font:500 10.5px var(--f-mono);fill:var(--muted)}

.arcnote{margin:4px 0 8px;padding-left:18px;font-size:13px;line-height:1.5}
.tl .tc.scn{opacity:.55;border:1px dashed var(--bg)}
.tl .tc.colcur{outline:1px solid var(--fg);outline-offset:0}
.tl .tdiv{width:0;min-width:100%;box-sizing:border-box;font:500 11px var(--f-mono);color:var(--muted);padding:10px 2px 2px;position:sticky;left:0}
.gb{display:grid;gap:3px}
.gb:empty{display:none}
.beats button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;font:500 11px var(--f-mono);font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:5px 0;cursor:pointer;position:relative}

.beats button.span{border-color:var(--accent)}
.beats button.plant{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2));border-color:var(--accent)}
.beats button.pay{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.beats button.flagged::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--open);border:1.5px solid var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line-2);border-radius:6px;padding:8px 14px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}

:root[data-skin="paper"]{color-scheme:light;--bg:#f4f0e6;--surface:#fffdf8;--surface-2:#f1ece0;--surface-3:#e6dfce;--line:#ddd5c2;--line-2:#c5bba3;--fg:#2b261e;--muted:#6a6355;--faint:#8c8473;--person:#a8741f;--corp:#2f7a8c;--place:#6a62b0;--event:#a8416a;--idea:#4d8a5f;--open:#d63a2f;--herring:#a8741f;--irony:#b57d00;--withheld:#1580b3;--accent:#c2188f;--ok:#2f8f46;--dot:rgba(43,38,30,.09)}
:root[data-skin="dusk"]{color-scheme:dark;--bg:#13111d;--surface:#1b1829;--surface-2:#242036;--surface-3:#2e2944;--line:#342f4d;--line-2:#463f68;--fg:#e6e1f6;--muted:#9d96bc;--faint:#7a739c;--accent:#ffb454;--dot:rgba(230,225,246,.06)}
:root[data-skin="paper"] .toast,:root[data-skin="paper"] .pop,:root[data-skin="paper"] .tip{box-shadow:0 8px 24px rgba(60,50,30,.18)}
.sec{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sec>summary{cursor:pointer;list-style:none;padding:9px 12px;font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"▸";font-size:11px;transition:transform .15s}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec>summary:hover{color:var(--fg)}
.sec>summary .n{margin-left:auto;font:500 12px var(--f-mono);color:var(--faint)}
.secb{padding:2px 12px 12px;display:flex;flex-direction:column;gap:10px}
.start{border:1px solid var(--accent);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.start h3{color:var(--accent);margin:0}
.step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 8px;align-items:start}

.step .more{grid-column:2;display:flex;flex-direction:column;gap:6px}
#skinbtn{white-space:nowrap}

  aside.open{height:72vh}
  .sheetbar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:none;border:0;background:none;width:100%;text-align:left;cursor:pointer}
  .sheetbar::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line-2);position:absolute;left:50%;top:5px;transform:translateX(-50%)}
  .sheetbar b{font-family:var(--f-display);font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="app">
  <header>
    <h1><input class="titlein" id="storytitle" aria-label="Story title (click to rename)" maxlength="80" spellcheck="false"><input class="subin" id="storysub" placeholder="+ subtitle" aria-label="Subtitle" maxlength="80" spellcheck="false"></h1>
    <div class="seg" id="lens" role="group" aria-label="Knowledge lens"></div>
    <div class="chips" id="chips"></div>
    <input class="search" id="search" type="search" placeholder="Find a name…" aria-label="Find a node">
    <button class="btn" id="skinbtn"></button>
    <div class="pop" id="pop" hidden></div>
  </header>
  <main>
    <div class="board" id="board">
      <svg id="graph" role="img" aria-label="Story web"></svg>
      <div class="timeline" id="timeline" hidden></div>
      <div class="tools" id="tools"></div>
      <div class="hint">Hover to spotlight · hover a line to read it · drag to pin, double-click to unpin · pink handle connects · shift-click multi-selects</div>
      <div class="tip" id="tip" hidden></div>
      <div class="boardmsg" id="boardmsg">Loading the story web…</div>
    </div>
    <aside id="panel">
      <button class="sheetbar" id="sheetbar" aria-expanded="false"><b id="sheettitle">Story web</b><span class="muted small">tap to open</span></button>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="pbody" id="pbody" aria-live="polite"></div>
    </aside>
  </main>
  <footer>
    <div class="strip-top">
      <span class="eyebrow">Story so far</span>
      <span class="readout" id="readout"></span>
      <button class="add" id="unitedit" title="Rename these, for example to chapters" aria-label="Rename the sections of your story">✎</button><input class="lensin" id="unitin" hidden maxlength="20" aria-label="What do you call each section?">
      <span class="prog" id="prog" hidden></span>
      <button class="btn" id="allbtn">Show all beats</button>
    </div>
    <div class="tpl" id="tpl" hidden></div>
    <div class="beats" id="beats"></div>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
/* ============ constants & state ============ */
const COLLS=["nodes","links","beats","questions","scenarios","clues","changes","settings","scenes","arcpts"];
const S={};COLLS.forEach(c=>S[c]=new Map());
/* ============ CONFIG: edit this block to make the web your own ============ */
const CONFIG={
  title:"Story Webber",                 // shown in the header and browser tab
  subtitle:"",                          // small text beside the title, e.g. "story web · London, 2353". "" hides it
  intro:{eyebrow:"",heading:"Who knows what, and when"},   // heading block at the top of the Story tab
  background:[],                        // rows for the Story tab, e.g. [["Setting","A city under the sea"],["Now","The Crown is a figurehead"]]
  beatCount:20,                         // number of beats on the bottom strip
  // Starting node types: [key, name, colour]. Writers can add, rename, recolour and remove these in the app (Setup tab).
  types:[["person","Character","#c7a25e"],["place","Place","#8c86c6"],["corp","Group","#5e9dac"],["event","Event","#bf6f8e"],["idea","Idea","#78a685"]],
  // Acts for the bottom bar: [key, label]. Beats are assigned to a key.
  acts:[["1","Act 1"],["2","Act 2"],["3","Act 3"]],
  // Truth filter tabs: [key, label, description]. Keep "truth" as the first one.
  reader:"Reader",                      // name of the "what the reader knows" view. Editable in Setup
  pov:"Character",                       // name of the viewpoint character, used for the second knowledge view. Editable in Setup
  neon:["#ff2bd6","#22e4ff","#c6ff3d","#ffb020","#9d7bff","#ff6b3d"]
};
const BASE=JSON.parse(JSON.stringify({title:CONFIG.title,subtitle:CONFIG.subtitle,eyebrow:CONFIG.intro.eyebrow,heading:CONFIG.intro.heading,acts:CONFIG.acts,types:CONFIG.types,pov:CONFIG.pov,reader:CONFIG.reader,background:CONFIG.background}));
const TYPE_PALETTE=["#c7a25e","#5e9dac","#8c86c6","#bf6f8e","#78a685","#d98c5f","#6fa8dc","#b5a642","#a67db8","#e06c75","#4fb3a5","#9aa5b1"];
const NEON=CONFIG.neon;
const plural=w=>/(s|x|z|ch|sh)$/i.test(w)?w+"es":/[^aeiou]y$/i.test(w)?w.slice(0,-1)+"ies":w+"s";
let UN={};
function setUnit(name){const t=(name||"").trim()||"Beat";const one=t[0].toUpperCase()+t.slice(1);UN={one,many:plural(one),l1:one.toLowerCase(),lm:plural(one).toLowerCase()}}
setUnit("Beat");
const buildLenses=(p,r)=>{const rd=r==="Reader"?"the reader":r;return [["truth","Truth","Everything that is true, regardless of who knows it"],["character",p,`What ${p} knows by the selected ${UN.l1}`],["reader",r,`What ${rd} knows by the selected ${UN.l1}`],["gaps","Gaps",`Yellow: ${rd} knows and ${p} doesn't. Blue: ${p} knows and ${rd} doesn't.`]]};
let LENSES=buildLenses(CONFIG.pov,CONFIG.reader);
let TYPES={};
const normTypes=a=>Object.fromEntries((a||[]).map(t=>Array.isArray(t)?t:[t.key,t.name,t.color]).filter(t=>t[0]).map(([k,n,c])=>[k,{label:n,one:n,color:c||"#9aa5b1"}]));
TYPES=normTypes(BASE.types);
let ACTS=Object.fromEntries(CONFIG.acts);
const loaded=new Set();
let db=null,canWrite=true,dbFailed=false,isLocal=false;

const pref=(()=>{try{return JSON.parse(localStorage.getItem("mw-prefs")||"{}")}catch(e){return{}}})();
const ui={view:"tab",tab:"story",sel:null,link:null,beatView:null,clue:null,beat:null,
  board:["timeline","arcs"].includes(pref.board)?pref.board:"web",sec:{},hideStart:!!pref.hideStart,skin:["noir","paper","dusk"].includes(pref.skin)?pref.skin:(matchMedia("(prefers-color-scheme: light)").matches?"paper":"noir"),lens:LENSES.some(l=>l[0]===pref.lens)?pref.lens:"truth",offTypes:new Set(),multi:new Set(),focus:null,
  hidden:new Set(pref.hidden||[]),draftInto:pref.draftInto||null,q:"",confirm:null,deciding:null,
  hover:null,hoverLink:null,sheet:false,focusField:null};
function savePref(){try{localStorage.setItem("mw-prefs",JSON.stringify({hidden:[...ui.hidden],draftInto:ui.draftInto,lens:ui.lens,board:ui.board,hideStart:ui.hideStart,skin:ui.skin}))}catch(e){}}

/* ============ helpers ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
applySettings();
const SKINS=[["noir","Noir"],["paper","Paper"],["dusk","Dusk"]];
function applySkin(){document.documentElement.dataset.skin=ui.skin;const b=$("skinbtn");b.textContent="◐ "+SKINS.find(x=>x[0]===ui.skin)[1];b.title="Change the look";try{if(loaded.size>=COLLS.length)schedule()}catch(e){}}
$("skinbtn").onclick=()=>{const i=SKINS.findIndex(x=>x[0]===ui.skin);ui.skin=SKINS[(i+1)%SKINS.length][0];savePref();applySkin()};
applySkin();
const clone=o=>o==null?null:JSON.parse(JSON.stringify(o));
const strip=o=>{if(!o)return null;const {id,...r}=o;return clone(r)};
const norm=o=>{if(!o)return null;const {x,y,pinned,...r}=o;return JSON.stringify(r)};
const newId=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const firstType=()=>Object.keys(TYPES)[0];
const col=t=>(TYPES[t]||Object.values(TYPES)[0]||{color:"#9aa5b1"}).color;
const nm=id=>S.nodes.get(id)?.name||"(deleted)";
const scen=id=>S.scenarios.get(id);
const PAPER_INK={"#ff2bd6":"#b5139a","#22e4ff":"#0b7d96","#c6ff3d":"#5d8a00","#ffb020":"#a86400","#9d7bff":"#5b3fc4","#ff6b3d":"#c13c12"};
const ink=c=>document.documentElement.dataset.skin==="paper"?(PAPER_INK[String(c).toLowerCase()]||c):c;
const scColor=id=>ink(scen(id)?.color||"#ff2bd6");
const shownDraft=x=>!x.draft||(S.scenarios.has(x.draft)&&!ui.hidden.has(x.draft));
const beatDoc=n=>S.beats.get("b"+String(n).padStart(2,"0"));
const beatsSorted=()=>[...S.beats.values()].sort((a,b)=>a.n-b.n);
const openQs=()=>[...S.questions.values()].filter(q=>q.status!=="decided");
const openQFor=id=>openQs().filter(q=>q.node===id);
const RO=()=>canWrite&&db?"":"disabled";
const fmtDate=t=>{const d=new Date(t);return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})};
const bnum=v=>{if(v===""||v==null)return null;const n=Math.round(+v);return isNaN(n)?null:Math.max(0,Math.min(CONFIG.beatCount,n))};
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function handleErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument"&&!canWrite){toast("You can view this web but not edit it.")}
  else if(c==="quota_exceeded")toast("The story database is full. Clear some history to keep editing.");
  else if(c==="revoked"||c==="not_granted"){canWrite=false;toast("Editing isn't available in this view.")}
  else toast("That change didn't save. Try again in a moment.");
}
function clueFlags(c){const f=[];if(c.planted==null)f.push("Nothing planted");if(c.payoff==null)f.push("No payoff");if(c.planted!=null&&c.payoff!=null&&c.payoff<c.planted)f.push("Pays off before it's planted");return f}

/* ============ writes ============ */
async function commit(summary,items,opts={}){
  if(!db||!canWrite){toast("Editing isn't available in this view.");return false}
  const rec=[];
  try{
    for(const it of items){
      const before=strip(S[it.coll].get(it.id));
      const after=it.after?clone(it.after):null;
      const ref=db.doc(it.coll+"/"+it.id);
      if(after)await ref.set(after);else if(before)await ref.delete();else continue;
      rec.push({coll:it.coll,id:it.id,before,after});
    }
    if(!rec.length)return true;
    const draft=opts.draft??rec.every(r=>r.coll==="scenarios"||!!(r.after||r.before||{}).draft);
    await db.collection("changes").doc(newId("ch")).set({at:Date.now(),by:"you",summary,items:rec,draft,synced:opts.synced??draft,undone:false});
    return true;
  }catch(e){if(e&&e.code==="invalid_argument")canWrite=false;handleErr(e);renderPanel(true);return false}
}
function patch(coll,id,fields,summary){
  const cur=strip(S[coll].get(id));if(!cur)return;
  const after={...cur,...fields};
  if(norm(after)===norm(cur))return;
  return commit(summary,[{coll,id,after}]);
}
async function undo(chId){
  const ch=S.changes.get(chId);if(!ch||ch.undone)return;
  const ok=await commit("Undid: "+ch.summary,[...ch.items].reverse().map(it=>({coll:it.coll,id:it.id,after:it.before})),{draft:ch.draft,synced:ch.draft||!ch.synced});
  if(ok){try{await db.doc("changes/"+chId).update({undone:true,synced:ch.synced||ch.draft})}catch(e){handleErr(e)}}
}
const canUndo=ch=>!ch.undone&&ch.items.every(it=>norm(strip(S[it.coll].get(it.id)))===norm(it.after));

/* ============ graph ============ */
const svg=d3.select("#graph");
const root=svg.append("g");
const gLinks=root.append("g"),gLabs=root.append("g");
const temp=root.append("line").attr("class","temp hide");
const gNodes=root.append("g");
const zoom=d3.zoom().scaleExtent([.2,3]).on("zoom",e=>root.attr("transform",e.transform));
svg.call(zoom).on("dblclick.zoom",null);
svg.on("click",e=>{if(e.target===svg.node()){ui.multi.clear();if(ui.view!=="tab"){ui.view="tab"}ui.confirm=null;renderAll()}});

const simMap=new Map();let simNodes=[],simLinks=[],nodeSel=null,linkSel=null,labSel=null,lastSig="",dragging=null,moved=false,connTarget=null;
const W=()=>svg.node().clientWidth||800,H=()=>svg.node().clientHeight||600;
function clusterOf(t){const ks=Object.keys(TYPES),i=ks.indexOf(t);if(ks.length<2||i<0)return[0,0];const a=-Math.PI/2+i*2*Math.PI/ks.length;return[.26*Math.cos(a),.24*Math.sin(a)]}
const degree=new Map();
const rad=o=>{const d=o.d;const base=10;const r=base+Math.min(degree.get(o.id)||0,12)*.55;return d.minor?Math.max(6,r*.7):r};
const sim=d3.forceSimulation().alphaDecay(.03)
  .force("link",d3.forceLink().id(d=>d.id).distance(l=>l.d.draft?120:100).strength(.4))
  .force("charge",d3.forceManyBody().strength(-520).distanceMax(600))
  .force("collide",d3.forceCollide(o=>rad(o)+22))
  .force("x",d3.forceX(o=>W()*clusterOf(o.d.t)[0]).strength(.045))
  .force("y",d3.forceY(o=>H()*clusterOf(o.d.t)[1]).strength(.045))
  .on("tick",tick);
sim.stop();
function tick(){
  if(!nodeSel)return;
  linkSel.selectAll("line").attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  labSel.attr("x",d=>(d.source.x+d.target.x)/2).attr("y",d=>(d.source.y+d.target.y)/2-3);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
}
function seedPos(n){
  if(n.pinned&&n.x!=null)return{x:n.x,y:n.y};
  const nb=[...S.links.values()].filter(l=>l.s===n.id||l.t===n.id).map(l=>simMap.get(l.s===n.id?l.t:l.s)).filter(o=>o&&o.x!=null);
  if(nb.length)return{x:d3.mean(nb,o=>o.x)+(Math.random()-.5)*40,y:d3.mean(nb,o=>o.y)+(Math.random()-.5)*40};
  return{x:W()*clusterOf(n.t)[0]+(Math.random()-.5)*80,y:H()*clusterOf(n.t)[1]+(Math.random()-.5)*80};
}
function rebuild(){
  const ns=[...S.nodes.values()].filter(shownDraft);
  const ids=new Set(ns.map(n=>n.id));
  simNodes=ns.map(n=>{
    let o=simMap.get(n.id);
    if(!o){o={id:n.id,...seedPos(n)};simMap.set(n.id,o)}
    o.d=n;
    if(o!==dragging){if(n.pinned&&n.x!=null){o.fx=n.x;o.fy=n.y}else if(!o.localPin){o.fx=null;o.fy=null}}
    return o;
  });
  const ls=[...S.links.values()].filter(l=>shownDraft(l)&&ids.has(l.s)&&ids.has(l.t));
  degree.clear();ls.forEach(l=>{degree.set(l.s,(degree.get(l.s)||0)+1);degree.set(l.t,(degree.get(l.t)||0)+1)});
  simLinks=ls.map(l=>({id:l.id,source:simMap.get(l.s),target:simMap.get(l.t),d:l}));

  linkSel=gLinks.selectAll("g.lk").data(simLinks,d=>d.id).join(enter=>{
    const g=enter.append("g").attr("class","lk");
    g.append("line").attr("class","vis");g.append("line").attr("class","hit");
    g.on("click",(e,d)=>{e.stopPropagation();openLink(d.id)})
     .on("mouseenter",(e,d)=>{ui.hoverLink=d.id;paint();showTip(linkTip(d.d),e)}).on("mousemove",e=>moveTip(e)).on("mouseleave",()=>{ui.hoverLink=null;paint();hideTip()});
    return g});
  linkSel.attr("class",d=>"lk"+(d.d.k==="herring"?" herring":"")+(d.d.draft?" draft":"")).style("--sc",d=>d.d.draft?scColor(d.d.draft):null);
  labSel=gLabs.selectAll("text").data(simLinks,d=>d.id).join("text").attr("class","lab hide").attr("text-anchor","middle");

  nodeSel=gNodes.selectAll("g.node").data(simNodes,d=>d.id).join(enter=>{
    const g=enter.append("g").attr("tabindex",0).attr("role","button");
    g.append("circle").attr("class","ring");g.append("circle").attr("class","core");
    g.append("circle").attr("class","dot").attr("r",4.5);
    g.append("circle").attr("class","pinmark").attr("r",2.6);
    g.append("text").attr("class","nm").attr("text-anchor","middle");
    g.append("circle").attr("class","handle").attr("r",5);
    g.on("click",nodeClick).on("dblclick",nodeDbl)

       if(ui.view==="node"&&ui.sel&&ui.sel!==d.id){const l=[...S.links.values()].find(x=>shownDraft(x)&&((x.s===ui.sel&&x.t===d.id)||(x.t===ui.sel&&x.s===d.id)));if(l)showTip(linkTip(l),e)}})
     .on("mousemove",e=>moveTip(e)).on("mouseleave",()=>{ui.hover=null;paint();hideTip()});
    g.call(nodeDrag);g.select(".handle").call(connDrag);
    return g});
  nodeSel.attr("class",d=>"node "+d.d.t+(d.d.draft?" draft":"")).attr("aria-label",d=>d.d.name)
    .style("--sc",d=>d.d.draft?scColor(d.d.draft):null);
  nodeSel.select(".core").attr("r",rad).style("fill",d=>col(d.d.t));
  nodeSel.select(".ring").attr("r",d=>rad(d)+4);
  nodeSel.select(".dot").attr("cx",d=>rad(d)*.75).attr("cy",d=>-rad(d)*.75);
  nodeSel.select(".pinmark").attr("cx",d=>-rad(d)*.75).attr("cy",d=>-rad(d)*.75);
  nodeSel.select(".handle").attr("cx",d=>rad(d)+7).attr("cy",0);
  nodeSel.select(".nm").attr("dy",d=>rad(d)+13).text(d=>d.d.name);

  sim.nodes(simNodes);sim.force("link").links(simLinks);
  const sig=[...ids].sort().join()+"|"+ls.map(l=>l.id+l.s+l.t).sort().join();
  if(sig!==lastSig){
    if(!lastSig){for(let i=0;i<320;i++)sim.tick();tick();fit(false);sim.alpha(.05).restart()}
    else sim.alpha(.35).restart();

  }else tick();

}
function fit(anim=true){
  const vis=simNodes.filter(o=>!o.hidden);if(!vis.length)return;
  const w=W(),h=H(),pad=50;
  const x0=d3.min(vis,o=>o.x),x1=d3.max(vis,o=>o.x),y0=d3.min(vis,o=>o.y),y1=d3.max(vis,o=>o.y);
  const k=Math.min(1.4,.95*Math.min((w-pad*2)/(x1-x0||1),(h-pad*2)/(y1-y0||1)));
  const t=d3.zoomIdentity.translate(w/2-k*(x0+x1)/2,h/2-k*(y0+y1)/2+10).scale(k);
  (anim?svg.transition().duration(450):svg).call(zoom.transform,t);
}
const nodeDrag=d3.drag()
  .filter(e=>!e.button&&!(e.target.classList&&e.target.classList.contains("handle")))

  .on("drag",(e,d)=>{if(!moved){moved=true;sim.alphaTarget(.12).restart()}d.fx=e.x;d.fy=e.y})
  .on("end",(e,d)=>{sim.alphaTarget(0);dragging=null;
    if(moved){d.fx=e.x;d.fy=e.y;d.localPin=true;
      if(db&&canWrite)db.doc("nodes/"+d.id).update({x:Math.round(e.x),y:Math.round(e.y),pinned:true}).catch(handleErr);
      paint();
    }else if(!d.d.pinned&&!d.localPin){d.fx=null;d.fy=null}});
const connDrag=d3.drag()
  .on("start",(e,d)=>{e.sourceEvent.stopPropagation();temp.classed("hide",false).attr("x1",d.x).attr("y1",d.y).attr("x2",d.x).attr("y2",d.y)})
  .on("drag",(e,d)=>{const [x,y]=d3.pointer(e.sourceEvent,root.node());temp.attr("x2",x).attr("y2",y);
    const t=simNodes.find(o=>o.id!==d.id&&!o.hidden&&Math.hypot(o.x-x,o.y-y)<rad(o)+10);connTarget=t?t.id:null;
    nodeSel.classed("target",o=>o.id===connTarget)})
  .on("end",(e,d)=>{temp.classed("hide",true);nodeSel.classed("target",false);const t=connTarget;connTarget=null;if(t)createLink(d.id,t)});

/* ============ tooltip ============ */
const tip=$("tip");
function linkTip(l){const lim=ui.beat??CONFIG.beatCount;return `<b>${esc(nm(l.s))} → ${esc(nm(l.t))}</b><br>${esc(linkText(l,lim))}<span class="m">${(l.steps||[]).map(s=>s.b?UN.one[0]+s.b:"world").join(" · ")}${l.k==="herring"?" · red herring":""}${l.draft?" · draft":""}</span>`}
function showTip(html,e){tip.innerHTML=html;tip.hidden=false;moveTip(e)}
function moveTip(e){if(tip.hidden)return;const r=$("board").getBoundingClientRect();let x=e.clientX-r.left+14,y=e.clientY-r.top+14;const w=tip.offsetWidth,h=tip.offsetHeight;if(x+w>r.width-8)x=e.clientX-r.left-w-14;if(y+h>r.height-8)y=e.clientY-r.top-h-14;tip.style.left=Math.max(8,x)+"px";tip.style.top=Math.max(8,y)+"px"}
function hideTip(){tip.hidden=true}

/* ============ paint (classes only) ============ */
function linkText(l,lim){const st=(l.steps||[]).filter(s=>s.b<=lim);const s=st.length?st[st.length-1]:(l.steps||[])[0];return s?s.text:""}
function gapOf(l,lim){const m=l.m!=null&&l.m<=lim,r=l.r!=null&&l.r<=lim;return m===r?null:(r?"irony":"withheld")}
function paint(){
  renderBoardMode();
  if(ui.board!=="web"){renderStrip();return}
  if(!nodeSel)return;
  const lim=ui.beat??CONFIG.beatCount,lens=ui.lens;
  const linkKnown=l=>{if(lens==="truth"||lens==="gaps")return true;const v=lens==="reader"?l.d.r:l.d.m;return v!=null&&v<=lim};
  const nodeKnown=o=>lens==="truth"||lens==="gaps"||(o.d.beat??0)<=lim;
  let fv=null;
  if(ui.focus){fv=new Set(ui.focus);simLinks.forEach(l=>{if(ui.focus.has(l.source.id))fv.add(l.target.id);if(ui.focus.has(l.target.id))fv.add(l.source.id)})}
  simNodes.forEach(o=>o.hidden=ui.offTypes.has(o.d.t)||(fv&&!fv.has(o.id)));
  let hl=null,hlLink=null;
  if(ui.q){const q=ui.q.toLowerCase();hl=new Set(simNodes.filter(o=>o.d.name.toLowerCase().includes(q)).map(o=>o.id))}
  else if(ui.view==="node"&&ui.sel){hl=new Set([ui.sel]);simLinks.forEach(l=>{if(l.source.id===ui.sel)hl.add(l.target.id);if(l.target.id===ui.sel)hl.add(l.source.id)});hlLink=l=>l.source.id===ui.sel||l.target.id===ui.sel}
  else if(ui.view==="link"&&ui.link&&S.links.get(ui.link)){const L=S.links.get(ui.link);hl=new Set([L.s,L.t]);hlLink=l=>l.id===ui.link}
  else if(ui.view==="clue"&&ui.clue&&S.clues.get(ui.clue)){hl=new Set(S.clues.get(ui.clue).nodes||[]);hlLink=l=>hl.has(l.source.id)&&hl.has(l.target.id)}
  else if(ui.beat!=null&&beatDoc(ui.beat)){hl=new Set(beatDoc(ui.beat).ids||[]);hlLink=l=>(l.d.steps||[]).some(s=>s.b===ui.beat)&&hl.has(l.source.id)&&hl.has(l.target.id)}
  else if(ui.view==="tab"&&ui.tab==="questions"){hl=new Set(openQs().map(q=>q.node).filter(Boolean))}
  else if(ui.view==="tab"&&ui.tab==="whatifs"){hl=new Set(simNodes.filter(o=>o.d.draft).map(o=>o.id));simLinks.forEach(l=>{if(l.d.draft){hl.add(l.source.id);hl.add(l.target.id)}});hlLink=l=>!!l.d.draft}
  if(lens==="gaps"&&!hlLink){const g=simLinks.filter(l=>gapOf(l.d,lim));hl=hl||new Set();g.forEach(l=>{hl.add(l.source.id);hl.add(l.target.id)});hlLink=l=>!!gapOf(l.d,lim)}
  if(ui.hover&&!ui.q&&!hl){const h=ui.hover;hl=new Set([h]);simLinks.forEach(l=>{if(l.source.id===h)hl.add(l.target.id);if(l.target.id===h)hl.add(l.source.id)});hlLink=l=>l.source.id===h||l.target.id===h}
  const cuts=new Set();S.scenarios.forEach((s,id)=>{if(!ui.hidden.has(id))(s.cuts||[]).forEach(c=>cuts.add(c))});
  const touchHover=l=>ui.hover&&(l.source.id===ui.hover||l.target.id===ui.hover);
  nodeSel.classed("hide",o=>o.hidden)
    .classed("faded",o=>!nodeKnown(o))
    .classed("dim",o=>nodeKnown(o)&&hl&&!hl.has(o.id))
    .classed("sel",o=>ui.view==="node"&&o.id===ui.sel)
    .classed("multi",o=>ui.multi.has(o.id))
    .classed("quiet",o=>o.d.minor&&!(hl&&hl.has(o.id))&&ui.hover!==o.id&&!(fv&&fv.has(o.id)));
  nodeSel.select(".dot").attr("display",o=>openQFor(o.id).length?null:"none");
  nodeSel.select(".pinmark").attr("display",o=>(o.d.pinned||o.localPin)?null:"none");
  linkSel.classed("hide",l=>l.source.hidden||l.target.hidden)
    .classed("faded",l=>!linkKnown(l))
    .classed("dim",l=>linkKnown(l)&&!!hl&&!(hlLink&&hlLink(l))&&!touchHover(l)&&ui.hoverLink!==l.id)
    .classed("hl",l=>ui.hoverLink===l.id||!!(hlLink&&hlLink(l)&&lens!=="gaps"))
    .classed("irony",l=>lens==="gaps"&&gapOf(l.d,lim)==="irony")
    .classed("withheld",l=>lens==="gaps"&&gapOf(l.d,lim)==="withheld")
    .classed("cut",l=>cuts.has(l.id));
  labSel.text(l=>linkText(l.d,lim)).classed("hide",l=>l.source.hidden||l.target.hidden||!(ui.view==="link"&&l.id===ui.link));
  renderStrip();
}

/* drag a beat to reorder it or move it to another act (mouse and pen, or press and hold on touch; the move buttons on the beat also work) */
let drag=null,dragJustEnded=false,ghost=null,bar=null;
function dragTarget(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);const grp=el&&el.closest("#beats .grp[data-k]");
  document.querySelectorAll(".grp.dropto").forEach(x=>x.classList.remove("dropto"));
  if(!grp){bar.style.display="none";return null}
  const items=[...grp.querySelectorAll("[data-beat]")].filter(b=>+b.dataset.beat!==drag.n);
  const idx=items.filter(b=>{const r=b.getBoundingClientRect();return e.clientX>r.left+r.width/2}).length;
  if(!items.length){grp.classList.add("dropto");bar.style.display="none";return{k:grp.dataset.k,idx:0}}
  const ref=items[Math.min(idx,items.length-1)].getBoundingClientRect();
  bar.style.display="block";bar.style.left=(idx<items.length?ref.left-2:ref.right+1)+"px";bar.style.top=ref.top+"px";bar.style.height=ref.height+"px";
  return{k:grp.dataset.k,idx};
}
$("beats").addEventListener("pointerdown",e=>{
  if(e.button!==0||!(canWrite&&db))return;
  const b=e.target.closest(".gb [data-beat]");if(!b)return;
  drag={n:+b.dataset.beat,el:b,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,on:false,target:null,touch:e.pointerType==="touch"};
  if(drag.touch){const d=drag;d.timer=setTimeout(()=>{if(drag!==d||d.on)return;activateDrag();dragTarget2()},380)}
});
function activateDrag(){
  drag.on=true;drag.el.classList.add("dragging");
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  ghost=document.createElement("div");ghost.className="dragghost";ghost.textContent=`${drag.n} · ${(beatDoc(drag.n)||{}).title||""}`;document.body.appendChild(ghost);
  bar=document.createElement("div");bar.className="dropbar";bar.style.display="none";document.body.appendChild(bar);
}
function dragTarget2(){const e={clientX:drag.lx,clientY:drag.ly};ghost.style.left=(e.clientX+12)+"px";ghost.style.top=(Math.max(0,e.clientY-48))+"px";drag.target=dragTarget(e)}
window.addEventListener("pointermove",e=>{
  if(!drag)return;
  drag.lx=e.clientX;drag.ly=e.clientY;
  if(!drag.on){
    const dist=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
    if(drag.touch){if(dist>8){clearTimeout(drag.timer);drag=null}return}
    if(dist<6)return;
    activateDrag();
  }
  if(drag.touch){dragTarget2();return}
  ghost.style.left=(e.clientX+12)+"px";ghost.style.top=(e.clientY+12)+"px";
  drag.target=dragTarget(e);
});
window.addEventListener("touchmove",e=>{if(drag&&drag.on&&e.cancelable)e.preventDefault()},{passive:false});
window.addEventListener("pointercancel",()=>{if(!drag)return;clearTimeout(drag.timer);if(drag.on)endDrag(drag);drag=null});
$("beats").addEventListener("contextmenu",e=>{if(e.target.closest("[data-beat]"))e.preventDefault()});
function endDrag(d){
  if(ghost)ghost.remove();if(bar)bar.remove();ghost=bar=null;
  document.querySelectorAll(".grp.dropto").forEach(x=>x.classList.remove("dropto"));
  if(d&&d.el)d.el.classList.remove("dragging");
}
window.addEventListener("pointerup",()=>{
  if(!drag)return;clearTimeout(drag.timer);const d=drag;drag=null;
  if(!d.on)return;
  endDrag(d);dragJustEnded=true;setTimeout(()=>{dragJustEnded=false},60);
  if(d.target)moveBeatTo(d.n,d.target.k,d.target.idx);
});
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&drag&&drag.on){endDrag(drag);drag=null;dragJustEnded=true;setTimeout(()=>{dragJustEnded=false},60)}});
$("beats").onclick=e=>{
  if(dragJustEnded)return;
  const bt=e.target.closest("[data-beat]");if(bt){openBeat(+bt.dataset.beat);return}
  const ab=e.target.closest("[data-addbeat]");if(ab){addBeat(ab.dataset.addbeat);return}

/* Rewrite every beat number, and everything that points at a beat number, to match a new order. */
async function restructureBeats(finalList,summary){
  const old=beatsSorted();
  const map=new Map();finalList.forEach((e,i)=>{if(e.oldN!=null)map.set(e.oldN,i+1)});
  const kept=[...map.keys()].sort((a,b)=>a-b);
  const fallback=o=>{let best=0;for(const k of kept){if(k<o)best=map.get(k);else break}return best};
  const mapRef=v=>{if(v==null||v===0)return v;return map.has(v)?map.get(v):fallback(v)};
  const items=[];
  finalList.forEach((e,i)=>{
    const n=i+1,id=pad2(n),cur=S.beats.get(id);
    if(e.oldN!=null){
      if(e.oldN===n&&cur&&cur.act===e.act)return;
      const base=strip(S.beats.get(pad2(e.oldN)));if(!base)return;
      items.push({coll:"beats",id,after:{...base,n,act:e.act}});
    }else items.push({coll:"beats",id,after:{n,act:e.act,title:`${UN.one} ${n}`,text:"",ids:[],status:"idea",words:0,...(e.newDoc||{})}});
  });
  for(let k=finalList.length+1;k<=old.length;k++)if(S.beats.get(pad2(k)))items.push({coll:"beats",id:pad2(k),after:null});
  S.nodes.forEach(n=>{const nb=mapRef(n.beat);if(nb!==n.beat)items.push({coll:"nodes",id:n.id,after:{...strip(n),beat:nb}})});
  S.links.forEach(l=>{
    const steps=(l.steps||[]).map(x=>({...x,b:mapRef(x.b)})).sort((a,b)=>(a.b??0)-(b.b??0));
    const m=mapRef(l.m),r=mapRef(l.r);
    if(JSON.stringify(steps)!==JSON.stringify(l.steps||[])||m!==l.m||r!==l.r)items.push({coll:"links",id:l.id,after:{...strip(l),steps,m:m??null,r:r??null}});
  });
  S.questions.forEach(q=>{
    if(q.beat==null)return;
    if(!map.has(q.beat)&&fallback(q.beat)===0){items.push({coll:"questions",id:q.id,after:q.node?{...strip(q),beat:null}:null});return}
    const nb=mapRef(q.beat);if(nb!==q.beat)items.push({coll:"questions",id:q.id,after:{...strip(q),beat:nb}});
  });
  S.scenes.forEach(sc=>{
    let nb=mapRef(sc.beat);if(!map.has(sc.beat)&&nb===0)nb=finalList.length?1:0;
    if(nb===0){items.push({coll:"scenes",id:sc.id,after:null});return}
    if(nb!==sc.beat)items.push({coll:"scenes",id:sc.id,after:{...strip(sc),beat:nb}});
  });
  S.clues.forEach(c=>{
    let pl=mapRef(c.planted),po=mapRef(c.payoff);if(pl===0)pl=null;if(po===0)po=null;
    if(pl!==c.planted||po!==c.payoff)items.push({coll:"clues",id:c.id,after:{...strip(c),planted:pl??null,payoff:po??null}});
  });
  {const del=[],set=[],tgt=new Set();
   S.arcpts.forEach(x=>{if(!map.has(x.beat)){del.push(x);return}const nb=map.get(x.beat);if(nb===x.beat)return;const nid=apId(x.node,nb);tgt.add(nid);del.push(x);set.push({coll:"arcpts",id:nid,after:{node:x.node,beat:nb,v:x.v}})});
   del.filter(x=>!tgt.has(x.id)).forEach(x=>items.push({coll:"arcpts",id:x.id,after:null}));set.forEach(i=>items.push(i))}
  if(!items.length)return true;
  ui.busy=true;
  const ok=await commit(summary,items,{synced:true});
  ui.busy=false;
  if(ok){
    if(ui.beat!=null){const nb=mapRef(ui.beat);ui.beat=nb>0?nb:null}
    if(ui.beatView!=null){const nb=mapRef(ui.beatView);if(map.has(ui.beatView))ui.beatView=nb;else{ui.beatView=null;if(ui.view==="beat")ui.view="tab"}}
  }
  schedule();
  return ok;
}
async function addBeat(actKey){
  const groups=beatGroups();
  let g=groups.find(x=>x.k===(actKey??CONFIG.acts[0]?.[0]));
  if(!g)g=groups.find(x=>x.k===null)||groups[groups.push({k:null,items:[]})-1];
  const entry={oldN:null,act:g.k??""};g.items.push(entry);
  const list=flatGroups(groups);const n=list.indexOf(list.find(e=>e.oldN==null))+1;
  if(await restructureBeats(list,`Added ${UN.l1} ${n}`)){openBeat(n);ui.focusField="title";renderPanel(true)}
}
async function moveBeatTo(n,actKey,idx){
  const groups=beatGroups();let item=null,from=null,fi=-1;
  groups.forEach(g=>g.items.forEach((it,i)=>{if(it.oldN===n){item=it;from=g;fi=i}}));
  const to=groups.find(g=>g.k===actKey);if(!item||!to)return;
  from.items.splice(fi,1);
  let at=Math.max(0,Math.min(idx,to.items.length));
  to.items.splice(at,0,item);
  const list=flatGroups(groups);
  if(list.every((e,i)=>e.oldN===i+1&&(S.beats.get(pad2(i+1))||{}).act===e.act))return;
  await restructureBeats(list,`Moved ${UN.l1} ${n}`);
}
async function moveBeatStep(n,dir){
  const groups=beatGroups().filter(g=>g.k!==null||g.items.length);
  let gi=-1,ii=-1;groups.forEach((g,a)=>g.items.forEach((it,i)=>{if(it.oldN===n){gi=a;ii=i}}));if(gi<0)return;
  const g=groups[gi];
  if(dir<0){
    if(ii>0)return moveBeatTo(n,g.k,ii-1);
    const prev=groups.slice(0,gi).reverse().find(x=>x.k!==null);if(prev)return moveBeatTo(n,prev.k,prev.items.length);
  }else{
    if(ii<g.items.length-1)return moveBeatTo(n,g.k,ii+1);
    const next=groups.slice(gi+1).find(x=>x.k!==null);if(next)return moveBeatTo(n,next.k,0);
  }
}

function makeLocalDb(){
  const KEY="story-webber-data-v1";let store={};
  try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){store={}}
  const subs={};let warned=false;
  const col=n=>store[n]||(store[n]={});
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){if(!warned){warned=true;toast("This browser can't save your story. Use Export in Setup to keep a copy.")}}};
  const fire=n=>(subs[n]||[]).forEach(cb=>cb({docs:Object.entries(col(n)).map(([id,d])=>({id,data:()=>JSON.parse(JSON.stringify(d))}))}));
  const ref=(n,id)=>({
    async set(d){col(n)[id]=JSON.parse(JSON.stringify(d));save();fire(n)},
    async update(f){col(n)[id]={...(col(n)[id]||{}),...JSON.parse(JSON.stringify(f))};save();fire(n)},
    async delete(){delete col(n)[id];save();fire(n)}});
  return{
    collection(n){return{onSnapshot(cb){(subs[n]=subs[n]||[]).push(cb);setTimeout(()=>fire(n),0);return()=>{}},doc(id){return ref(n,id)}}},
    doc(path){const [n,id]=path.split("/");return ref(n,id)},
    __all(){return JSON.parse(JSON.stringify(store))},
    __replace(data){store={};COLLS.forEach(n=>{if(data[n])store[n]=data[n]});save();COLLS.forEach(fire)}
  };
}

async function setArcPoint(nid,b,v){const n=S.nodes.get(nid);if(!n)return;const id=apId(nid,b),cur=S.arcpts.get(id);
  if(cur&&cur.v===v)await commit(`${n.name}: cleared arc score, ${UN.l1} ${b}`,[{coll:"arcpts",id,after:null}]);

function arcNotes(n,bs){
  const pts=arcPts(n.id).sort((a,b)=>a.beat-b.beat),out=[];
  if(!pts.length)return [`Click the grid to score where ${n.name} stands in each ${UN.l1}, from ${CONFIG.arcLow} up to ${CONFIG.arcHigh}.`];
  const vs=pts.map(x=>x.v);
  if(pts.length>=3&&Math.max(...vs)-Math.min(...vs)<=1)out.push(`Flat arc: ${n.name} barely moves across ${pts.length} scores. Fine for a steady character, but check it is deliberate.`);
  if(pts.length>=2){const d=vs[vs.length-1]-vs[0];out.push(d>=3?`Ends clearly higher than they start (${d>0?"+":""}${d}): a positive arc.`:d<=-3?`Ends clearly lower than they start (${d}): a tragic or fall arc.`:`Ends close to where they start.`)}
  const inb=bs.map(b=>inPlay(b).has(n.id)),appear=inb.filter(Boolean).length;
  if(appear&&appear<bs.length){out.push(`In play in ${appear} of ${bs.length} ${UN.lm}.`);let run=0,best=0,end=0;inb.forEach((x,i)=>{run=x?0:run+1;if(run>best){best=run;end=i}});if(best>=3)out.push(`Off the page for ${best} ${UN.lm} in a row (${UN.one} ${bs[end-best+1].n} to ${bs[end].n}).`)}
  const gaps=bs.filter(b=>inPlay(b).has(n.id)&&!S.arcpts.has(apId(n.id,b.n))).length;
  if(gaps&&pts.length)out.push(`${gaps} ${UN.l1}${gaps===1?"":"s"} where they appear but have no score yet.`);
  return out;
}

P.addEventListener("click",async e=>{

    case "unpin":{const o=simMap.get(id);if(o){o.localPin=false;o.fx=null;o.fy=null;sim.alpha(.2).restart()}if(db&&canWrite)db.doc("nodes/"+id).update({pinned:false}).catch(handleErr);renderPanel(true);break}
    case "addrow":{const lw=t.closest("[data-listwrap]");const [c,nid,f]=lw.dataset.listwrap.split("|");const cur=S[c].get(nid);patch(c,nid,{[f]:[...(cur[f]||[]),{k:"",v:""}]},`Edited ${cur.name}: added a line`);break}
    case "delrow":{const lw=t.closest("[data-listwrap]");const [c,nid,f]=lw.dataset.listwrap.split("|");const cur=S[c].get(nid);const rows=[...(cur[f]||[])];rows.splice(+t.dataset.i,1);patch(c,nid,{[f]:rows},`Edited ${cur.name}: removed a line`);break}
    case "addstep":{const l=S.links.get(ui.link);const last=(l.steps||[]).slice(-1)[0];patch("links",l.id,{steps:[...(l.steps||[]),{b:Math.min(CONFIG.beatCount,(last?.b||0)+1),text:"later meaning"}]},`Edited ${nm(l.s)} → ${nm(l.t)}: added a meaning`);break}
    case "delstep":{const l=S.links.get(ui.link);if((l.steps||[]).length<2){toast("A connection needs at least one meaning.");break}const st=[...l.steps];st.splice(+t.dataset.i,1);patch("links",l.id,{steps:st},`Edited ${nm(l.s)} → ${nm(l.t)}: removed a meaning`);break}
    case "delnode":{const n=S.nodes.get(ui.sel);const items=[...S.links.values()].filter(l=>l.s===n.id||l.t===n.id).map(l=>({coll:"links",id:l.id,after:null}));items.push({coll:"nodes",id:n.id,after:null});
      S.beats.forEach(b=>{if((b.ids||[]).includes(n.id))items.push({coll:"beats",id:b.id,after:{...strip(b),ids:b.ids.filter(x=>x!==n.id)}})});
      S.arcpts.forEach(x=>{if(x.node===n.id)items.push({coll:"arcpts",id:x.id,after:null})});
      S.scenes.forEach(sc=>{const had=sc.pov===n.id||sc.loc===n.id||(sc.cast||[]).includes(n.id);if(had)items.push({coll:"scenes",id:sc.id,after:{...strip(sc),pov:sc.pov===n.id?"":sc.pov,loc:sc.loc===n.id?"":sc.loc,cast:(sc.cast||[]).filter(x=>x!==n.id)}})});
      ui.confirm=null;ui.view="tab";await commit(`Deleted ${n.name}`,items);break}
    case "dellink":{const l=S.links.get(ui.link);ui.confirm=null;ui.view="tab";await commit(`Deleted connection ${nm(l.s)} → ${nm(l.t)}`,[{coll:"links",id:l.id,after:null}]);break}
    case "addq":{const qid=newId("q");const doc={node:t.dataset.node||null,beat:t.dataset.beat?+t.dataset.beat:null,text:"New question",status:"open",decision:"",decidedAt:null};
      await commit(`Added question to ${doc.node?nm(doc.node):UN.one+" "+doc.beat}`,[{coll:"questions",id:qid,after:doc}]);ui.editQ=qid;break}
    case "decide":ui.deciding=id;ui.focusField="decision";renderPanel(true);break;
    case "canceldecide":ui.deciding=null;renderPanel(true);break;
    case "savedecision":{const v=($("dec-"+id)||{}).value||"";if(!v.trim()){toast("Write the decision first.");break}const q=S.questions.get(id);ui.deciding=null;
      await patch("questions",id,{status:"decided",decision:v.trim(),decidedAt:Date.now()},`Decided: ${q.text.slice(0,80)} → ${v.trim().slice(0,120)}`);break}
    case "reopen":{const q=S.questions.get(id);await patch("questions",id,{status:"open",decidedAt:null},`Reopened: ${q.text.slice(0,80)}`);break}
    case "beatremove":{const b=beatDoc(ui.beatView);patch("beats",b.id,{ids:(b.ids||[]).filter(x=>x!==id)},`${UN.one} ${b.n}: removed ${nm(id)}`);break}
    case "cluenoderm":{const c=S.clues.get(ui.clue);patch("clues",c.id,{nodes:(c.nodes||[]).filter(x=>x!==id)},`${c.name}: removed ${nm(id)}`);break}
    case "addclue":{const cid=newId("c");ui.view="clue";ui.clue=cid;ui.focusField="name";await commit("Added clue",[{coll:"clues",id:cid,after:{name:"New clue",kind:"clue",planted:ui.beat,payoff:null,nodes:ui.sel?[ui.sel]:[],note:""}}]);break}
    case "delclue":{const c=S.clues.get(ui.clue);ui.confirm=null;ui.view="tab";ui.tab="clues";await commit(`Deleted clue: ${c.name}`,[{coll:"clues",id:c.id,after:null}]);break}
    case "newsc":{const sid=newId("sc");const used=new Set([...S.scenarios.values()].map(s=>s.color));const color=NEON.find(c=>!used.has(c))||NEON[S.scenarios.size%NEON.length];
      ui.focusField="sc-"+sid;await commit("New what-if",[{coll:"scenarios",id:sid,after:{name:"Untitled what-if",desc:"",color,cuts:[],created:Date.now()}}],{draft:true});break}
    case "togglesc":ui.hidden.has(id)?ui.hidden.delete(id):ui.hidden.add(id);if(ui.hidden.has(id)&&ui.draftInto===id)ui.draftInto=null;savePref();rebuild();renderAll();break;
    case "draftinto":ui.draftInto=ui.draftInto===id?null:id;if(ui.draftInto)ui.hidden.delete(id);savePref();rebuild();renderAll();break;
    case "togglecut":{const s=scen(t.dataset.sc);const cuts=new Set(s.cuts||[]);cuts.has(ui.link)?cuts.delete(ui.link):cuts.add(ui.link);patch("scenarios",s.id,{cuts:[...cuts]},`${s.name}: ${cuts.has(ui.link)?"cut":"restored"} a connection`);break}
    case "canonitem":{const c=t.dataset.coll,x=S[c].get(id);await patch(c,id,{draft:null},`Made canon: ${c==="nodes"?x.name:nm(x.s)+" → "+nm(x.t)}`);break}
    case "binitem":{const c=t.dataset.coll,x=S[c].get(id);const items=[{coll:c,id,after:null}];if(c==="nodes")S.links.forEach(l=>{if(l.s===id||l.t===id)items.unshift({coll:"links",id:l.id,after:null})});ui.confirm=null;ui.view="tab";ui.tab="whatifs";
      await commit(`Binned draft: ${c==="nodes"?x.name:nm(x.s)+" → "+nm(x.t)}`,items);break}
    case "canonsc":{const s=scen(id);const items=[];S.nodes.forEach(n=>{if(n.draft===id)items.push({coll:"nodes",id:n.id,after:{...strip(n),draft:null}})});S.links.forEach(l=>{if(l.draft===id)items.push({coll:"links",id:l.id,after:{...strip(l),draft:null}})});
      (s.cuts||[]).forEach(c=>{if(S.links.has(c))items.push({coll:"links",id:c,after:null})});items.push({coll:"scenarios",id,after:null});ui.confirm=null;if(ui.draftInto===id)ui.draftInto=null;savePref();
      await commit(`Made canon: what-if "${s.name}"`,items,{draft:false});break}
    case "binsc":{const s=scen(id);const items=[];S.links.forEach(l=>{if(l.draft===id)items.push({coll:"links",id:l.id,after:null})});S.nodes.forEach(n=>{if(n.draft===id)items.push({coll:"nodes",id:n.id,after:null})});items.push({coll:"scenarios",id,after:null});ui.confirm=null;if(ui.draftInto===id)ui.draftInto=null;savePref();
      await commit(`Binned what-if "${s.name}"`,items,{draft:true});break}
    case "addact":{const used=new Set(CONFIG.acts.map(a=>a[0]));let k=1;while(used.has(String(k)))k++;await saveSettings({acts:actsOut([...CONFIG.acts,[String(k),"New act"]])},"Added an act");break}
    case "delact":{const i=+t.dataset.i;const [k,l]=CONFIG.acts[i]||[];if(beatsSorted().some(b=>b.act===k)){toast(`Move the ${UN.lm} out of this act first.`);break}await saveSettings({acts:actsOut(CONFIG.acts.filter((_,j)=>j!==i))},`Removed act: ${l}`);break}
    case "addbeat":await addBeat(CONFIG.acts[0]?.[0]);break
    case "delbeatyes":await deleteBeat(id);break
    case "beatmove":await moveBeatStep(+t.dataset.n,+t.dataset.dir);break
    case "addbg":await saveSettings({background:[...(CONFIG.bgRaw||[]),{k:"",v:""}]},"Added a story note");break
    case "delbg":await saveSettings({background:(CONFIG.bgRaw||[]).filter((_,j)=>j!==+t.dataset.i)},"Removed a story note");break
    case "addtype":{const used=new Set(Object.values(TYPES).map(v=>v.color));const color=TYPE_PALETTE.find(c=>!used.has(c))||TYPE_PALETTE[0];await saveSettings({types:[...typesOut(),{key:newId("t"),name:"New type",color}]},"Added a node type");break}
    case "deltype":{const i=+t.dataset.i;const arr=typesOut();const ty=arr[i];if(!ty)break;if(arr.length<2){toast("Keep at least one node type.");break}
      if([...S.nodes.values()].some(n=>n.t===ty.key)){toast("Some nodes use this type. Change their type first.");break}
      await saveSettings({types:arr.filter((_,j)=>j!==i)},`Removed node type: ${ty.name}`);break}
    case "savetype":{const name=(($("nt-name")||{}).value||"").trim();if(!name){toast("Give the type a name.");break}
      const color=($("nt-color")||{}).value||TYPE_PALETTE[0];const key=newId("t");const nid=ui.sel;ui.newType=false;
      if(await saveSettings({types:[...typesOut(),{key,name,color}]},`Added node type: ${name}`))await patch("nodes",nid,{t:key},`Edited ${nm(nid)}: type`);break}
    case "canceltype":ui.newType=false;renderPanel(true);break;
    case "bkexport":bkExport();break;
    case "bkimport":P.querySelector("[data-bkfile]")?.click();break;
    case "addarc":addArc(id);break;
    case "openarc":openArc(id);break;
    case "stoparcyes":stopArc(id);break;
    case "scene":openScene(id);break;
    case "addscene":addScene(+t.dataset.n);break;
    case "scenemove":moveScene(id,+t.dataset.dir);break;
    case "delsceneyes":deleteScene(id);break;
    case "scenecastrm":{const sc=S.scenes.get(ui.scene);if(sc)patch("scenes",sc.id,{cast:(sc.cast||[]).filter(x=>x!==id)},`Scene "${sc.title}": removed ${nm(id)}`);break}
    case "tpl":await applyTemplate(t.dataset.id);break;
    case "addnode":addNode();break;
    case "gotimeline":ui.board="timeline";savePref();renderTools();paint();break;
    case "hidestart":ui.hideStart=true;savePref();renderPanel(true);break;
    case "undo":await undo(id);break;
  }
});

/* ============ render all & data ============ */
let raf=0;
function schedule(){if(raf||ui.busy)return;raf=requestAnimationFrame(()=>{raf=0;if(loaded.size<COLLS.length)return;applySettings();renderLens();renderChips();$("boardmsg").hidden=S.nodes.size>0;if(!S.nodes.size)$("boardmsg").textContent="Nothing on the web yet. Press + Node to add a character, place or idea. The checklist on the Story tab will guide you.";rebuild();renderTools();renderPanel()})}
function renderAll(){renderLens();renderChips();renderTools();renderPanel(true);paint()}
renderLens();renderChips();renderTools();renderPanel(true);
(async()=>{
  const c=window.claude;
  try{db=c&&c.use?await c.use("db"):null}catch(e){db=null}
  if(!db){db=makeLocalDb();isLocal=true}
  if(!isLocal)try{const user=await c.use("user");const w=user&&user.can?await user.can("data.write"):null;canWrite=w!==false}catch(e){}
  COLLS.forEach(name=>{
    db.collection(name).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()}));S[name]=m;loaded.add(name);schedule()},
      err=>{loaded.add(name);if(err&&err.code==="revoked"){canWrite=false}toast("Lost the live connection to the story data. Reload to reconnect.")});
  });
})();
let rsz=0;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>fit(),500);sim.force("x").x(o=>W()*clusterOf(o.d.t)[0]);sim.force("y").y(o=>H()*clusterOf(o.d.t)[1]);if(simNodes.length)sim.alpha(.2).restart()});
</script>
